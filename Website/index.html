<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台語語音辨識與翻譯機器人</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="style.css?v=22">
</head>

<body>
    <div class="solar-system">
        <div class="planet mercury"></div>
        <div class="planet venus"></div>
        <div class="planet earth"></div>
        <div class="planet mars"></div>
        <div class="planet jupiter"></div>
        <div class="planet saturn"></div>
        <div class="planet uranus"></div>
        <div class="planet neptune"></div>
    </div>
    <div class="app-wrapper">
        <div class="sidebar">
            <h2>歷史紀錄</h2>
            <div id="historyList" class="history-list">
                <div class="empty-history">尚未有歷史紀錄</div>
            </div>
        </div>
        <div class="container">
            <div class="panel asr-panel">
                <h1>華語 -> 台語</h1>
                <p class="subtitle">華語語音辨識：請確定環境噪音低於30分貝，並按下開始錄音，即可辨識華語語音，停止錄音後請稍等</p>

                <div class="config-section">
                    <div class="form-group">

                    </div>

                    <div class="form-group">
                        <div class="checkbox-group">
                            <input type="checkbox" id="interimResults">
                            <label for="interimResults">顯示即時辨識結果</label>
                        </div>
                    </div>
                </div>

                <div class="controls">
                    <button id="startBtn" type="button">開始錄音</button>
                    <button id="stopBtn" type="button" disabled>停止錄音</button>
                </div>



                <div id="status" class="status disconnected">
                    未連線
                </div>

                <div class="transcription-box" id="transcriptionBox">
                    <div class="empty-state">
                        請點擊 "開始錄音" 以開始...
                    </div>
                </div>
            </div>

            <div class="vertical-divider"></div>

            <div class="panel tts-panel">
                <h1>文字轉語音 (TTS)</h1>
                <p class="subtitle">輸入文字轉換為台語語音</p>

                <div class="config-section">
                    <div class="form-group">
                        <label for="ttsText">輸入文字:</label>
                        <textarea id="ttsText" placeholder="請輸入您想要轉換的文字"></textarea>
                    </div>
                    <div class="form-group">

                    </div>
                </div>
                <div class="controls">
                    <div id="ttsBtn" class="btn" role="button" tabindex="0">產生音檔</div>
                </div>
                <div id="ttsStatus" class="status" style="display: none;"></div>
                <audio id="ttsAudioPlayer" controls autoplay class="tts-audio-player" style="display: none;"></audio>
            </div>
        </div>
    </div>

    <script src="script.js?v=22"></script>
    </script>
</body>

</html>
