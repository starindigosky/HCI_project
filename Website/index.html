<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>即時語音辨識（中文 -> 閩南語）</title>
    <link rel="stylesheet" href="style.css?v=2">
</head>

<body>
    <div class="app-wrapper">
        <div class="sidebar">
            <h2>歷史紀錄</h2>
            <div id="historyList" class="history-list">
                <div class="empty-history">尚未有歷史紀錄</div>
            </div>
        </div>
        <div class="container">
            <div class="panel asr-panel">
                <h1>普通話 -> 閩南語</h1>
                <p class="subtitle">中文語音辨識：請確定環境噪音低於30分貝，並按下開始錄音，即可辨識中文語音，停止錄音後請稍等</p>

                <div class="config-section">
                    <div class="form-group">
                        <!-- <label for="language">語言</label>
                        <select id="language">
                            <option value="chinese">Chinese (中文)</option>
                        </select> -->
                    </div>

                    <div class="form-group">
                        <div class="checkbox-group">
                            <input type="checkbox" id="interimResults">
                            <label for="interimResults">顯示即時辨識結果</label>
                        </div>
                    </div>
                </div>

                <div class="controls">
                    <button id="startBtn" type="button">開始錄音</button>
                    <button id="stopBtn" type="button" disabled>停止錄音</button>
                </div>

                <div class="speaker-controls">
                    <label>目前講者：</label>
                    <div class="speaker-toggle">
                        <button id="speakerABtn" class="speaker-btn active" onclick="setSpeaker('A')">講者 A</button>
                        <button id="speakerBBtn" class="speaker-btn" onclick="setSpeaker('B')">講者 B</button>
                    </div>
                </div>

                <div id="status" class="status disconnected">
                    Disconnected
                </div>

                <div class="transcription-box" id="transcriptionBox">
                    <div class="empty-state">
                        Click "Start Recording" to begin...
                    </div>
                </div>
            </div>

            <div class="panel tts-panel">
                <h1>打字輸入語音辨識(TTS)</h1>
                <p class="subtitle">Convert text to Min Nan speech</p>

                <div class="config-section">
                    <div class="form-group">
                        <label for="ttsText">輸入文字:</label>
                        <textarea id="ttsText" placeholder="請輸入您想要轉換的文本"></textarea>
                    </div>
                    <div class="form-group">
                        <!-- <label for="ttsSourceLang">Source Language:</label>
                        <select id="ttsSourceLang">
                            <option value="chinese">Chinese (中文)</option>
                        </select> -->
                    </div>
                </div>
                <div class="controls">
                    <button id="ttsBtn" type="button">生成音檔</button>
                </div>
                <div id="ttsStatus" class="status" style="display: none;"></div>
                <audio id="ttsAudioPlayer" controls autoplay class="tts-audio-player" style="display: none;"></audio>
            </div>
        </div>
    </div>

    <script src="script.js?v=2"></script>
</body>

</html>
